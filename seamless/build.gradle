apply plugin: 'com.android.application'

android {
    namespace 'nie.translator.seamless'
    compileSdk 36
    defaultConfig {
        applicationId 'nie.translator.seamless'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '0.2-wav-benchmark'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}
dependencies {
    // Optional CI-only GPU build; ordinary APKs retain pinned Maven runtime.
    if (project.hasProperty('seamlessOrtAar')) {
        implementation files(project.property('seamlessOrtAar'))
    } else {
        implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    // Experimental mixed FFN path: FP32 compact CPU first row + NNAPI Edge TPU INT8 tail.
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
