name: Production RTranslator fast-path build

on:
  push:
    branches: [seamless-streaming]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/production-app-fast-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source and native dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12674087" "cmake;3.22.1"
      - name: Run app unit tests and build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload production app debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RTranslator-production-fast-path-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
