name: Build minimal Seamless port and runtime test
on:
  push:
    branches: [seamless-streaming]
    paths:
      - 'seamless/**'
      - 'seamless-port/make_android_fixture.py'
      - 'seamless-port/android_test.sh'
      - 'seamless-port/check_native.py'
      - '.github/workflows/seamless-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install tools and create test fixture
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "build-tools;34.0.0"
          python -m pip install 'numpy<2' 'onnx==1.16.2'
          python seamless-port/make_android_fixture.py
      - name: Build minimal APK and instrumentation tests
        shell: bash
        run: |
          mkdir -p install-diagnostics
          for attempt in 1 2 3 4; do
            if bash ./gradlew -PseamlessOnly :seamless:testDebugUnitTest :seamless:assembleRelease :seamless:assembleDebug :seamless:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2 2>&1 | tee "install-diagnostics/gradle-$attempt.txt"; then
              exit 0
            fi
            if [[ "$attempt" == 4 ]] || ! grep -Eq 'Received status code 429|Too Many Requests|Received status code 503' "install-diagnostics/gradle-$attempt.txt"; then
              exit 1
            fi
            echo "Transient dependency server failure, retrying"
            sleep $((60 * attempt))
          done
      - name: Verify APK and native library packaging
        run: |
          mkdir -p install-diagnostics
          APK=seamless/build/outputs/apk/release/seamless-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee install-diagnostics/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee install-diagnostics/badging.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > install-diagnostics/zipalign.txt
          python seamless-port/check_native.py "$APK" | tee install-diagnostics/native.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install release and execute ONNX instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: bash seamless-port/android_test.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seamless-test-reports
          path: install-diagnostics/
          if-no-files-found: warn
      - name: Upload clearly labeled test APK
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-streaming-integration-UNVALIDATED
          path: seamless/build/outputs/apk/release/seamless-release.apk
