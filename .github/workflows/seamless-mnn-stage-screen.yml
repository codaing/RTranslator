name: Native ARM64 whole-stage MNN backend feasibility
on:
  push:
    branches: [seamless-streaming]
    paths:
      - '.github/workflows/seamless-mnn-stage-screen.yml'
      - 'seamless-port/mnn_stage_screen.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mnn-stage-screen-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Seamless-projected-FP16-model-pack-EXPERIMENTAL
          path: base-artifact
          run-id: '46083582838'
          github-token: ${{ github.token }}
      - name: Extract unchanged validated source-projected model
        run: |
          set -euo pipefail
          INNER=$(find base-artifact -name 'seamless-projected-fp16-experimental.zip' -print -quit)
          test -n "$INNER"
          mkdir -p models speech-reports
          unzip -q "$INNER" -d models
          rm -rf base-artifact
          df -h .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching CPU runtime and prepare same Mandarin fixture
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==1.26.4' 'onnx==1.20.1' 'onnxruntime==1.30.0' 'sympy==1.14.0'
          python seamless-port/audio_fixture.py speech-input
          mkdir -p java-out
          javac -d java-out seamless/src/main/java/nie/translator/seamless/StreamingFbank.java seamless-port/FbankCli.java
          java -cp java-out FbankCli speech-input/mandarin.pcm speech-input/fbank.bin
          sha256sum speech-input/fbank.bin
      - name: Install pinned MNN native runtime and converter
        run: |
          python -m pip install 'MNN==3.6.2'
          python -c 'import MNN, MNN.nn, MNN.expr; print(MNN.__file__)'
          command -v mnnconvert
      - name: Capture genuine stage inputs from one unchanged speech run
        run: python -u seamless-port/mnn_stage_screen.py capture models speech-input/fbank.bin captures
      - name: Compare all five complete stages against ORT
        run: python -u seamless-port/mnn_stage_screen.py screen models captures speech-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Seamless-MNN-stage-screen-reports
          path: |
            speech-reports/*.json
            speech-reports/*.log
            captures/baseline.json
          if-no-files-found: warn
          retention-days: 7
