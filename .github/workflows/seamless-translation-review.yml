name: Decode encoder window translation reports
on:
  push:
    branches: [seamless-streaming]
    paths:
      - '.github/workflows/seamless-translation-review.yml'
      - 'seamless-port/review_translations.py'
      - 'seamless-port/test_review_translations.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test text rendering logic
        run: python -m unittest discover -s seamless-port -p test_review_translations.py
      - uses: actions/download-artifact@v4
        with:
          name: Seamless-encoder-window-speech-diagnostics
          path: reports
          run-id: '46085455536'
          github-token: ${{ github.token }}
      - name: Load the pinned upstream tokenizer
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
          python -m pip install 'numpy<2' 'torch==2.1.1' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'fairseq2==0.2.1' --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.1.1/cpu
          git clone https://github.com/facebookresearch/seamless_communication.git /tmp/meta-seamless
          git -C /tmp/meta-seamless checkout 9a081e935c29c6b1e0e05bcbf3fcb623ad306524
          python -m pip install -e /tmp/meta-seamless
          python -u seamless-port/review_translations.py reports translations.json
      - uses: actions/upload-artifact@v4
        with:
          name: Seamless-readable-translation-review
          path: translations.json
          retention-days: 7
