name: ARM64 encoder cadence and thread tuning
on:
  push:
    branches: [seamless-streaming]
    paths:
      - '.github/workflows/seamless-arm-cadence.yml'
      - 'seamless-port/compare_arm_cadence.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arm-cadence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-and-smoke:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_RUN_ID: '46002703236'
      UPDATE_FRAMES: '64'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download the previously validated four-model INT8 package
        uses: actions/download-artifact@v4
        with:
          name: Seamless-incremental-FP16-model-pack
          path: base-artifact
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Extract base package and free the outer artifact archive
        run: |
          set -euo pipefail
          INNER=$(find base-artifact -name 'seamless-incremental-fp16-experimental.zip' -print -quit)
          test -n "$INNER"
          mkdir -p models
          unzip -q "$INNER" -d models
          rm -rf base-artifact
          df -h .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Mandarin recording with Java filterbanks
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 seamless-port/audio_fixture.py speech-input
          mkdir -p java-out
          javac -d java-out seamless/src/main/java/nie/translator/seamless/StreamingFbank.java seamless-port/FbankCli.java
          java -cp java-out FbankCli speech-input/mandarin.pcm speech-input/fbank.bin
          sha256sum speech-input/mandarin.pcm speech-input/fbank.bin
          lscpu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android-matching ONNX Runtime
        run: python -m pip install 'numpy<2' 'onnxruntime==1.30.0' 'onnx==1.20.1'
      - name: Compare cadence and threads with unchanged FP16 model
        run: python -u seamless-port/compare_arm_cadence.py models speech-input/fbank.bin speech-reports
      - name: Upload ARM64 timing and parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-ARM64-cadence-report
          path: speech-reports/
          if-no-files-found: warn
          retention-days: 7
