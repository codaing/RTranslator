name: Seamless port source checks
on:
  push:
    branches: [seamless-streaming]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ONNX tools
        run: python -m pip install 'numpy<2' 'onnx==1.16.2' 'onnxruntime==1.18.1'
      - name: Check Python source
        run: python -m compileall -q seamless-port
      - name: Test continuous PCM framing (no model weights)
        run: python -m unittest discover -s seamless-port -p 'test_*.py'
