name: Seamless real checkpoint export and INT8 validation
on:
  push:
    branches: [seamless-streaming]
    paths:
      - 'seamless-port/export*.py'
      - 'seamless-port/shaw_export.py'
      - 'seamless-port/sdpa_export.py'
      - 'seamless-port/inspect_encoder.py'
      - 'seamless-port/repair_encoder_graph.py'
      - 'seamless-port/test_repair_encoder_graph.py'
      - 'seamless-port/shaw_regression.py'
      - 'seamless-port/quantize_int8.py'
      - 'seamless-port/weight_only_int8.py'
      - 'seamless-port/test_weight_only_int8.py'
      - 'seamless-port/fold_weights.py'
      - 'seamless-port/model_pack.py'
      - 'seamless-port/speech_smoke.py'
      - 'seamless-port/check_fbank.py'
      - 'seamless-port/audio_fixture.py'
      - 'seamless-port/FbankCli.java'
      - '.github/workflows/seamless-real-model.yml'
  workflow_dispatch:
    inputs:
      package_models:
        description: 'Run full speech test and package noncommercial model weights'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: [vocoder, encoder, decoder, units]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install historical reference runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg
          python -m pip install 'numpy<2' 'torch==2.1.1' 'torchaudio==2.1.1' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'fairseq2==0.2.1' --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.1.1/cpu
          git clone https://github.com/facebookresearch/seamless_communication.git /tmp/meta-seamless
          git -C /tmp/meta-seamless checkout 9a081e935c29c6b1e0e05bcbf3fcb623ad306524
          python -m pip install -e /tmp/meta-seamless 'numpy<2' 'onnx==1.16.2' 'onnxruntime==1.18.1'
          python -c 'import torch, fairseq2; print(torch.__version__, fairseq2.__version__)'
      - name: Check dynamic Shaw attention without checkpoint
        if: matrix.component == 'encoder'
        run: |
          python seamless-port/shaw_regression.py
          python -m unittest discover -s seamless-port -p test_repair_encoder_graph.py
      - name: Export actual checkpoint and compare with PyTorch
        shell: bash
        run: |
          mkdir -p model-check
          if [[ "${{ matrix.component }}" == units ]]; then
            python seamless-port/export_units.py model-check 2>&1 | tee model-check/export.log
          else
            python seamless-port/export_components.py "${{ matrix.component }}" model-check 2>&1 | tee model-check/export.log
          fi
          test -s "model-check/${{ matrix.component }}.validated.json"
      - name: Quantize and compare INT8 (decoder weight-only)
        timeout-minutes: 100
        if: matrix.component == 'encoder' || matrix.component == 'decoder'
        run: |
          python -u seamless-port/quantize_int8.py "${{ matrix.component }}" model-check 2>&1 | tee model-check/int8.log
          test -s "model-check/${{ matrix.component }}.int8.validated.json"
      - name: Upload model validation reports (not weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-${{ matrix.component }}-reports
          path: |
            model-check/*.json
            model-check/*.log
            model-check/*.txt
          if-no-files-found: warn
      - name: Stage verified model component
        if: inputs.package_models == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package-models]'))
        run: python seamless-port/model_pack.py stage "${{ matrix.component }}" model-check model-part
      - name: Transfer verified model component for integrated test
        if: inputs.package_models == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package-models]'))
        uses: actions/upload-artifact@v4
        with:
          name: model-part-${{ matrix.component }}
          path: model-part/
          retention-days: 1
          compression-level: 0
  integrated:
    if: inputs.package_models == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package-models]'))
    needs: export
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          pattern: model-part-*
          path: components
      - name: Install reference audio and ONNX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install 'numpy<2' 'torch==2.1.1' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'fairseq2==0.2.1' --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.1.1/cpu
          python -m pip install 'onnx==1.16.2' 'onnxruntime==1.18.1' 'numpy<2'
      - name: Prepare real Mandarin fixture and compare actual Java filterbanks
        run: |
          mkdir -p speech-reports java-out
          python seamless-port/audio_fixture.py speech-input
          javac -d java-out seamless/src/main/java/nie/translator/seamless/StreamingFbank.java seamless-port/FbankCli.java
          java -cp java-out FbankCli speech-input/mandarin.pcm speech-input/fbank.bin
          python seamless-port/check_fbank.py speech-input/mandarin.pcm speech-input/fbank.bin speech-reports/fbank.json
      - name: Assemble and run four-model speech smoke test
        run: |
          python seamless-port/model_pack.py merge components models
          rm -rf components
          python seamless-port/speech_smoke.py models speech-input/fbank.bin speech-reports/translated.wav
      - name: Collect speech report
        if: always()
        run: |
          mkdir -p speech-reports
          if test -f models/speech-smoke.json; then cp models/speech-smoke.json speech-reports/; fi
      - name: Upload waveform and latency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seamless-speech-validation
          path: speech-reports/
          if-no-files-found: warn
      - name: Generate Android import ZIP
        run: python seamless-port/model_pack.py pack models seamless-int8-experimental.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Seamless-INT8-experimental-model-pack
          path: seamless-int8-experimental.zip
          compression-level: 0
          retention-days: 3
