name: Real-model Vulkan projection parity APK
on:
  push:
    branches: [seamless-streaming]
    paths:
      - '.github/workflows/seamless-vulkan-real-projection.yml'
      - 'seamless-port/export_vulkan_projection_fixture.py'
      - 'seamless-port/test_export_vulkan_projection_fixture.py'
      - 'seamless-port/vulkan_real_projection.comp'
      - 'seamless-port/vulkan_probe.cpp'
      - 'seamless-port/build_vulkan_probe.sh'
      - 'seamless/src/main/java/nie/translator/seamless/VulkanProbe.java'
      - 'seamless/src/main/java/nie/translator/seamless/MainActivity.java'
      - 'seamless/src/androidTest/java/nie/translator/seamless/RuntimeTest.java'
      - 'seamless-port/android_test.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download previously parity-validated real model pack
        uses: actions/download-artifact@v4
        with:
          name: Seamless-projected-FP16-model-pack-EXPERIMENTAL
          path: base-artifact
          run-id: '46083582838'
          github-token: ${{ github.token }}
      - name: Extract model pack
        run: |
          set -euo pipefail
          INNER=$(find base-artifact -name 'seamless-projected-fp16-experimental.zip' -print -quit)
          test -n "$INNER"
          mkdir -p models
          unzip -q "$INNER" -d models
          rm -rf base-artifact
          test -s models/encoder.int8.onnx
          test -s models/decoder.source-projections.onnx
          test -s models/MODEL-LICENSE.txt
          echo "External model data files:"
          find models -maxdepth 1 -type f \( -name '*.weights' -o -name '*.data' \) -printf '%f %s bytes\n' | sort
          df -h .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install audio tools and prepare real Mandarin activation
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==1.26.4'
          python seamless-port/audio_fixture.py speech-input
          mkdir -p java-out
          javac -d java-out seamless/src/main/java/nie/translator/seamless/StreamingFbank.java seamless-port/FbankCli.java
          java -cp java-out FbankCli speech-input/mandarin.pcm speech-input/fbank.bin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ONNX Runtime and graph tools
        run: |
          python -m pip install 'numpy==1.26.4' 'onnx==1.20.1' 'onnxruntime==1.30.0' 'sympy==1.14.0'
      - name: Test fixture format and export one actual decoder projection
        run: |
          set -euo pipefail
          python -m unittest discover -s seamless-port -p 'test_export_vulkan_projection_fixture.py'
          mkdir -p real-projection-fixture
          python -u seamless-port/export_vulkan_projection_fixture.py models speech-input/fbank.bin real-projection-fixture
          test -s real-projection-fixture/vulkan-real-projection.bin
          test -s real-projection-fixture/projection-reference.onnx
          test -s real-projection-fixture/vulkan-real-projection.json
          cp models/MODEL-LICENSE.txt real-projection-fixture/projection-model-license.txt
          ls -lh real-projection-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: seamless-real-vulkan-projection-fixture
          path: real-projection-fixture/
          compression-level: 0
          retention-days: 7

  apk:
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seamless-real-vulkan-projection-fixture
          path: real-projection-fixture
      - name: Install fixture as app assets
        run: |
          set -euo pipefail
          mkdir -p seamless/src/main/assets install-diagnostics
          cp real-projection-fixture/vulkan-real-projection.bin seamless/src/main/assets/
          cp real-projection-fixture/projection-reference.onnx seamless/src/main/assets/
          cp real-projection-fixture/vulkan-real-projection.json seamless/src/main/assets/
          cp real-projection-fixture/projection-model-license.txt seamless/src/main/assets/
          cp real-projection-fixture/vulkan-real-projection.json install-diagnostics/
          python - <<'PY'
          import json, pathlib, struct
          p=pathlib.Path("seamless/src/main/assets/vulkan-real-projection.bin")
          data=p.read_bytes()
          magic,version,m,k,n=struct.unpack_from("<4sIIII",data)
          assert magic==b"SVP1" and version==2
          assert len(data)==20+m*k*4+n*k*2
          meta=json.loads(pathlib.Path("seamless/src/main/assets/vulkan-real-projection.json").read_text())
          assert (meta["M"],meta["K"],meta["N"])==(m,k,n)
          print(f"Embedded real model projection: M={m} K={k} N={n}; {len(data):,} bytes")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK, compile Vulkan shaders and native library
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "build-tools;34.0.0" "ndk;28.2.13676358"
          bash seamless-port/build_vulkan_probe.sh
          python -m pip install 'numpy<2' 'onnx==1.16.2'
          python seamless-port/make_android_fixture.py
      - name: Build APK and Android instrumentation
        shell: bash
        run: |
          mkdir -p install-diagnostics
          for attempt in 1 2 3 4; do
            if bash ./gradlew -PseamlessOnly :seamless:testDebugUnitTest :seamless:assembleRelease :seamless:assembleDebug :seamless:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2 2>&1 | tee "install-diagnostics/gradle-$attempt.txt"; then
              exit 0
            fi
            if [[ "$attempt" == 4 ]] || ! grep -Eq 'Received status code 429|Too Many Requests|Received status code 503' "install-diagnostics/gradle-$attempt.txt"; then
              exit 1
            fi
            echo "Transient dependency server failure, retrying"
            sleep $((60 * attempt))
          done
      - name: Verify APK and native library packaging
        run: |
          set -euo pipefail
          APK=seamless/build/outputs/apk/release/seamless-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee install-diagnostics/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee install-diagnostics/badging.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > install-diagnostics/zipalign.txt
          python seamless-port/check_native.py "$APK" | tee install-diagnostics/native.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install release and execute ONNX instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: REQUIRE_REAL_PROJECTION=1 bash seamless-port/android_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seamless-real-vulkan-projection-test-reports
          path: install-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Seamless-real-weight-Vulkan-projection-EXPERIMENTAL
          path: seamless/build/outputs/apk/release/seamless-release.apk
          retention-days: 7
