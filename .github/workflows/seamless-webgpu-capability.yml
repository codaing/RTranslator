name: WebGPU capability and real model graph inventory
on:
  push:
    branches: [seamless-streaming]
    paths:
      - '.github/workflows/seamless-webgpu-capability.yml'
      - 'seamless-port/WebGpuCapabilityProbe.java'
      - 'seamless-port/gpu_graph_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bundled-android-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare GPU-only synthetic probe
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;34.0.0"
          python -m pip install 'numpy<2' 'onnx==1.16.2'
          python seamless-port/make_android_fixture.py
          cp seamless-port/WebGpuCapabilityProbe.java seamless/src/androidTest/java/nie/translator/seamless/
          mkdir -p gpu-reports
          bash ./gradlew -PseamlessOnly :seamless:assembleDebug :seamless:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2 2>&1 | tee gpu-reports/gradle.log
          AAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.microsoft.onnxruntime/onnxruntime-android/1.30.0" -name '*.aar' -print -quit)
          test -n "$AAR"
          unzip -l "$AAR" | tee gpu-reports/aar-contents.txt
          unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/ort-classes.jar"
          javap -classpath "$RUNNER_TEMP/ort-classes.jar" 'ai.onnxruntime.OrtSession$SessionOptions' > gpu-reports/session-api.txt
          javap -classpath "$RUNNER_TEMP/ort-classes.jar" ai.onnxruntime.OrtEnvironment > gpu-reports/environment-api.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check real Android runtime provider registration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          script: |
            adb install --abi arm64-v8a --no-streaming seamless/build/outputs/apk/debug/seamless-debug.apk
            adb install --no-streaming seamless/build/outputs/apk/androidTest/debug/seamless-debug-androidTest.apk
            adb shell am instrument -w -r -e class nie.translator.seamless.WebGpuCapabilityProbe nie.translator.seamless.test/androidx.test.runner.AndroidJUnitRunner | tee gpu-reports/instrumentation.txt
            adb logcat -d -s WebGpuProbe:I '*:S' | tee gpu-reports/provider.txt
            grep -F 'OK (1 test)' gpu-reports/instrumentation.txt
            grep -F 'RESULT=' gpu-reports/provider.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Seamless-bundled-WebGPU-capability
          path: gpu-reports/
          if-no-files-found: warn
          retention-days: 7
  graph-inventory:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Seamless-projected-FP16-model-pack-EXPERIMENTAL
          path: base-artifact
          run-id: '46083582838'
          github-token: ${{ github.token }}
      - name: Inspect real graphs without loading external weights
        run: |
          set -euo pipefail
          python -m pip install 'onnx==1.20.1'
          mkdir -p models gpu-reports
          INNER=$(find base-artifact -name 'seamless-projected-fp16-experimental.zip' -print -quit)
          test -n "$INNER"
          unzip -q "$INNER" -d models
          python -u seamless-port/gpu_graph_audit.py models gpu-reports/graph-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Seamless-GPU-graph-inventory
          path: gpu-reports/
          if-no-files-found: warn
          retention-days: 7
