name: Package FP16 acoustic components and run integrated speech test
on:
  push:
    branches: [seamless-streaming]
    paths:
      - '.github/workflows/seamless-fp16-acoustic-package.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fp16-acoustic-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-and-smoke:
    runs-on: ubuntu-22.04
    env:
      BASELINE_RUN_ID: '45956345415'
      FP16_RUN_ID: '45992690814'
      UPDATE_FRAMES: '64'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download the previously validated four-model INT8 package
        uses: actions/download-artifact@v4
        with:
          name: Seamless-INT8-experimental-model-pack
          path: base-artifact
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Extract base package and free the outer artifact archive
        run: |
          set -euo pipefail
          INNER=$(find base-artifact -name 'seamless-int8-experimental.zip' -print -quit)
          test -n "$INNER"
          mkdir -p models
          unzip -q "$INNER" -d models
          rm -rf base-artifact
          rm -f models/units.onnx* models/units.validated.json
          rm -f models/vocoder.onnx* models/vocoder.validated.json
          rm -f models/sha256.json
          df -h .
      - name: Download validated FP16 UnitY2 component
        uses: actions/download-artifact@v4
        with:
          name: Seamless-units-FP16-experimental
          path: units-artifact
          run-id: ${{ env.FP16_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install FP16 UnitY2 graph and external weights
        run: |
          set -euo pipefail
          cp units-artifact/units.fp16.onnx models/units.onnx
          cp units-artifact/units.fp16.onnx.weights models/
          cp units-artifact/units.fp16.validated.json models/
          rm -rf units-artifact
      - name: Download validated FP16 vocoder component
        uses: actions/download-artifact@v4
        with:
          name: Seamless-vocoder-FP16-experimental
          path: vocoder-artifact
          run-id: ${{ env.FP16_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install FP16 vocoder graph and external weights
        run: |
          set -euo pipefail
          cp vocoder-artifact/vocoder.fp16.onnx models/vocoder.onnx
          cp vocoder-artifact/vocoder.fp16.onnx.weights models/
          cp vocoder-artifact/vocoder.fp16.validated.json models/
          rm -rf vocoder-artifact
          printf '%s\n' \
            'SeamlessStreaming model weights: Meta Platforms, Inc.' \
            'Converted from facebookresearch/seamless_communication, revision 9a081e935c29c6b1e0e05bcbf3fcb623ad306524.' \
            'Model weights licensed CC BY-NC 4.0: https://creativecommons.org/licenses/by-nc/4.0/' \
            'Source: https://github.com/facebookresearch/seamless_communication' \
            'Modifications: ONNX export; dynamic INT8 encoder; native asymmetric grouped INT8 decoder FFN projections; FP16 conversion of the UnitY2 acoustic-unit decoder and vocoder. FP16 acoustic components passed CPU ONNX Runtime parity tests. Experimental conversion; no warranty.' \
            'Noncommercial use only.' > models/MODEL-LICENSE.txt
          find models -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          df -h .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare Mandarin source and Java filterbanks
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install 'numpy<2' 'torch==2.1.1' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'fairseq2==0.2.1' --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.1.1/cpu
          python seamless-port/audio_fixture.py speech-input
          mkdir -p java-out
          javac -d java-out seamless/src/main/java/nie/translator/seamless/StreamingFbank.java seamless-port/FbankCli.java
          java -cp java-out FbankCli speech-input/mandarin.pcm speech-input/fbank.bin
          python seamless-port/check_fbank.py speech-input/mandarin.pcm speech-input/fbank.bin fbank-check.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android-matching ONNX Runtime
        run: python -m pip install 'numpy<2' 'onnxruntime==1.30.0' 'onnx==1.20.1'
      - name: Run integrated Mandarin speech test with FP16 acoustic components
        id: smoke
        run: |
          set -o pipefail
          mkdir -p speech-reports
          python -u seamless-port/speech_smoke.py models speech-input/fbank.bin speech-reports/translated.wav --update-frames "$UPDATE_FRAMES" 2>&1 | tee speech-reports/smoke.log
          cat models/speech-smoke.json
      - name: Create smaller importable model ZIP
        if: steps.smoke.outcome == 'success'
        run: |
          rm -f models/sha256.json
          python seamless-port/model_pack.py pack models seamless-int8-fp16-acoustic-experimental.zip
          ls -lh seamless-int8-fp16-acoustic-experimental.zip
      - name: Upload smaller importable model package
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-INT8-FP16-acoustic-experimental-model-pack
          path: seamless-int8-fp16-acoustic-experimental.zip
          compression-level: 0
          retention-days: 3
      - name: Upload integrated speech diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-FP16-acoustic-speech-report
          path: |
            models/speech-smoke.json
            speech-reports/
            fbank-check.json
          if-no-files-found: warn
          retention-days: 7
